
---
- name: Install and configure Nginx
  hosts: webservers
  become: true

  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy a custom homepage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
            <head><title>My AWS Lab</title></head>
            <body>
              <h1>Deployed with Ansible!</h1>
              <p>Running on my AWS EC2 instance.</p>
            </body>
          </html>
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Nginx is running and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
